name: Deploy static game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static files only
        run: |
          mkdir _site
          cp index.html LICENSE _site/
          cp -r static _site/
          # Give each deployment unique resource URLs, including translations.
          python3 - <<'PY'
          import os
          from pathlib import Path
          page = Path('_site/index.html')
          page.write_text(page.read_text().replace('__GAME_VERSION__', os.environ['GITHUB_SHA']))
          PY
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
